<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eternal Quest - RPG Игра</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 0;
            position: relative;
        }

        .game-container {
            width: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            position: relative;
        }

        .game-area, .game-info {
            background: rgba(22, 33, 62, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .character-stats {
            margin-bottom: 15px;
            background: rgba(51, 51, 51, 0.3);
            padding: 10px;
            border-radius: 10px;
        }

        .stat-bar {
            background: rgba(51, 51, 51, 0.5);
            height: 20px;
            border-radius: 10px;
            margin-bottom: 8px;
            overflow: hidden;
            position: relative;
        }

        .hp-bar {
            background: linear-gradient(90deg, #ff0000, #ff4444);
            height: 100%;
            width: 100%;
            transition: width 0.3s ease;
        }

        .mp-bar {
            background: linear-gradient(90deg, #0000ff, #4444ff);
            height: 100%;
            width: 100%;
            transition: width 0.3s ease;
        }

        .inventory {
            margin-top: 15px;
            background: rgba(51, 51, 51, 0.3);
            padding: 10px;
            border-radius: 10px;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .item {
            background: rgba(51, 51, 51, 0.5);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .item:active {
            transform: scale(0.95);
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
            position: sticky;
            bottom: 10px;
            z-index: 100;
        }

        .game-button {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            border: none;
            color: white;
            padding: 15px 25px;
            text-align: center;
            text-decoration: none;
            display: block;
            font-size: 16px;
            cursor: pointer;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .game-button:active {
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .battle-log {
            background: rgba(51, 51, 51, 0.3);
            padding: 12px;
            border-radius: 10px;
            height: 150px;
            overflow-y: auto;
            margin-top: 15px;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .location-description {
            margin-bottom: 15px;
            padding: 12px;
            background: rgba(51, 51, 51, 0.3);
            border-radius: 10px;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .quest-log {
            margin-top: 15px;
            background: rgba(51, 51, 51, 0.3);
            padding: 10px;
            border-radius: 10px;
        }

        .quest-item {
            background: rgba(51, 51, 51, 0.5);
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 10px;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h2 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #4CAF50;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        p {
            font-size: 14px;
            margin-bottom: 6px;
            color: #fff;
        }

        /* Стилизация скроллбара */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(51, 51, 51, 0.3);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: #4CAF50;
            border-radius: 3px;
        }

        /* Анимации */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .game-button {
            animation: pulse 2s infinite;
        }

        /* Поддержка темной темы */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #0a0a1a, #0f0f2a);
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-area">
            <div class="location-description" id="location-description">
                Добро пожаловать в деревню! Здесь вы можете отдохнуть и подготовиться к приключениям.
            </div>
            
            <div class="battle-log" id="battle-log">
                <!-- Здесь будет отображаться лог боя -->
            </div>

            <div class="action-buttons">
                <button class="game-button" id="explore-btn">Исследовать</button>
                <button class="game-button" id="rest-btn">Отдохнуть</button>
                <button class="game-button" id="shop-btn">Магазин</button>
                <button class="game-button" id="quests-btn">Квесты</button>
            </div>
        </div>

        <div class="game-info">
            <div class="character-stats">
                <h2>Характеристики</h2>
                <div>
                    <p>Уровень: <span id="level">1</span></p>
                    <p>Опыт: <span id="exp">0</span>/<span id="exp-to-next">100</span></p>
                </div>
                <div>
                    <p>Здоровье:</p>
                    <div class="stat-bar">
                        <div class="hp-bar" id="hp-bar"></div>
                    </div>
                    <p><span id="hp">100</span>/<span id="max-hp">100</span></p>
                </div>
                <div>
                    <p>Мана:</p>
                    <div class="stat-bar">
                        <div class="mp-bar" id="mp-bar"></div>
                    </div>
                    <p><span id="mp">50</span>/<span id="max-mp">50</span></p>
                </div>
                <div>
                    <p>Сила: <span id="str">10</span></p>
                    <p>Ловкость: <span id="dex">10</span></p>
                    <p>Интеллект: <span id="int">10</span></p>
                </div>
            </div>

            <div class="inventory">
                <h2>Инвентарь</h2>
                <div class="inventory-grid" id="inventory">
                    <!-- Здесь будут отображаться предметы -->
                </div>
            </div>

            <div class="quest-log">
                <h2>Активные квесты</h2>
                <div id="quests">
                    <!-- Здесь будут отображаться квесты -->
                </div>
            </div>
        </div>
    </div>

    <script src="rpg_game.js"></script>
    <script src="game_engine.js"></script>
</body>
</html>
