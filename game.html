<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eternal Conquest - PvP Arena</title>
    <style>
        /* Основные стили */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #0f0f2a);
            color: #fff;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Контейнер игры */
        .game-container {
            width: 90%;
            max-width: 1200px;
            background: rgba(22, 33, 62, 0.9);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Анимации */
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        .game-container {
            animation: fadeIn 0.7s ease-out;
        }

        /* Зона битвы */
        .battle-area {
            height: 400px;
            background: linear-gradient(135deg, #0a0a1a, #1a1a2e);
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            position: relative;
            overflow: hidden;
        }

        .arena-title {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
            text-shadow: 0 3px 5px rgba(0, 0, 0, 0.3);
        }

        .player, .enemy {
            width: 150px;
            height: 150px;
            background: #4CAF50;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .enemy {
            background: #FF4444;
        }

        .player:hover, .enemy:hover {
            transform: scale(1.1);
        }

        /* Панель управления */
        .control-panel {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .control-button {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
        }

        .control-button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
        }

        .control-button:active {
            transform: scale(0.95);
        }

        /* Журнал битвы */
        .battle-log {
            height: 150px;
            background: rgba(51, 51, 51, 0.7);
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.5;
        }

        .battle-log p {
            margin-bottom: 5px;
        }

        /* Подсветка действий */
        .damage-text {
            position: absolute;
            font-size: 20px;
            font-weight: bold;
            color: #FF0000;
            animation: floatUp 1s ease-out forwards;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0);
            }

            100% {
                opacity: 0;
                transform: translateY(-50px);
            }
        }
    </style>
</head>

<body>
    <div class="game-container">
        <div class="battle-area">
            <div class="arena-title">Арена PvP</div>
            <div class="player" id="player">Вы</div>
            <div class="enemy" id="enemy">Враг</div>
        </div>

        <div class="control-panel">
            <button class="control-button" id="attack-btn">Атаковать</button>
            <button class="control-button" id="defend-btn">Защищаться</button>
            <button class="control-button" id="special-btn">Спец. Удар</button>
        </div>

        <div class="battle-log" id="battle-log">
            <p>Добро пожаловать на арену!</p>
        </div>
    </div>

    <script>
        // Получение элементов
        const player = document.getElementById('player');
        const enemy = document.getElementById('enemy');
        const attackBtn = document.getElementById('attack-btn');
        const defendBtn = document.getElementById('defend-btn');
        const specialBtn = document.getElementById('special-btn');
        const battleLog = document.getElementById('battle-log');

        // Характеристики
        let playerHp = 100;
        let enemyHp = 100;

        // Функции для боя
        function logAction(message) {
            const logEntry = document.createElement('p');
            logEntry.textContent = message;
            battleLog.appendChild(logEntry);
            battleLog.scrollTop = battleLog.scrollHeight;
        }

        function attack() {
            const damage = Math.floor(Math.random() * 20) + 5;
            enemyHp -= damage;
            logAction(`Вы нанесли ${damage} урона!`);
            displayDamage(enemy, damage);
            checkVictory();
        }

        function defend() {
            const block = Math.floor(Math.random() * 10) + 5;
            logAction(`Вы заблокировали ${block} урона!`);
        }

        function specialAttack() {
            const damage = Math.floor(Math.random() * 30) + 10;
            enemyHp -= damage;
            logAction(`Специальный удар нанес ${damage} урона!`);
            displayDamage(enemy, damage);
            checkVictory();
        }

        function displayDamage(target, damage) {
            const damageText = document.createElement('div');
            damageText.textContent = `-${damage}`;
            damageText.className = 'damage-text';
            target.appendChild(damageText);

            setTimeout(() => {
                damageText.remove();
            }, 1000);
        }

        function checkVictory() {
            if (enemyHp <= 0) {
                logAction('Вы победили врага!');
                enemy.textContent = 'KO';
                attackBtn.disabled = true;
                defendBtn.disabled = true;
                specialBtn.disabled = true;
            }
        }

        // Обработчики событий
        attackBtn.addEventListener('click', attack);
        defendBtn.addEventListener('click', defend);
        specialBtn.addEventListener('click', specialAttack);
    </script>
</body>

</html>
