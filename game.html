<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eternal Conquest - PvP Arena</title>
    <style>
        /* Общие стили */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #0f0f2a);
            color: #fff;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Контейнер игры */
        .game-container {
            width: 90%;
            max-width: 1200px;
            background: rgba(22, 33, 62, 0.9);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .battle-area {
            height: 400px;
            background: linear-gradient(135deg, #0a0a1a, #1a1a2e);
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            position: relative;
            overflow: hidden;
        }

        .arena-title {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
            text-shadow: 0 3px 5px rgba(0, 0, 0, 0.3);
        }

        /* Персонажи */
        .character {
            width: 150px;
            height: 150px;
            background: #7BC043;
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            transition: transform 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .character:hover {
            transform: scale(1.1);
        }

        .character .eyes {
            position: absolute;
            top: 30px;
            display: flex;
            gap: 10px;
        }

        .character .eye {
            width: 30px;
            height: 30px;
            background: white;
            border-radius: 50%;
            position: relative;
        }

        .character .eye::after {
            content: '';
            width: 15px;
            height: 15px;
            background: black;
            border-radius: 50%;
            position: absolute;
            top: 7px;
            left: 7px;
        }

        .character .mouth {
            position: absolute;
            bottom: 30px;
            width: 60px;
            height: 20px;
            background: #FF6B6B;
            border-radius: 0 0 50px 50px;
        }

        /* Анимации моргания */
        @keyframes blink {
            0%, 90%, 100% {
                transform: scaleY(1);
            }

            95% {
                transform: scaleY(0);
            }
        }

        .character .eye {
            animation: blink 4s infinite;
        }

        /* Панель управления */
        .control-panel {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .control-button {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
        }

        .control-button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
        }

        .control-button:active {
            transform: scale(0.95);
        }

        /* Журнал битвы */
        .battle-log {
            height: 150px;
            background: rgba(51, 51, 51, 0.7);
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.5;
        }

        .battle-log p {
            margin-bottom: 5px;
        }
    </style>
</head>

<body>
    <div class="game-container">
        <div class="battle-area">
            <div class="arena-title">Арена PvP</div>
            <div class="character" id="player">
                <div class="eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
                <div class="mouth"></div>
            </div>
            <div class="character" id="enemy">
                <div class="eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
                <div class="mouth"></div>
            </div>
        </div>

        <div class="control-panel">
            <button class="control-button" id="attack-btn">Атаковать</button>
            <button class="control-button" id="defend-btn">Защищаться</button>
            <button class="control-button" id="special-btn">Спец. Удар</button>
        </div>

        <div class="battle-log" id="battle-log">
            <p>Добро пожаловать на арену!</p>
        </div>
    </div>
</body>

</html>
